x-airflow-common: &airflow-common
  image: sodosiro-airflow:2.10.4-kiwi
  build:
    context: .
    dockerfile: Dockerfile

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # 소규모 호스트용 메모리 안전값. LocalExecutor가 동시에 많은 task subprocess를
    # 만들지 않도록 제한하며, 필요하면 docker/.env에서 올릴 수 있다.
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-2}
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_RUNS_PER_DAG:-1}

    # 외부에 분리한 PostgreSQL 주소로 변경
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URL}

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    # scheduler 컨테이너의 /health(8974) 엔드포인트를 활성화한다.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # DAG 파일 수가 적으므로 parser process 하나면 충분하다. 반복 import 간격도
    # 늘려 scheduler의 상시 CPU/RSS 사용량을 낮춘다.
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: ${AIRFLOW_PARSING_PROCESSES:-1}
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: ${AIRFLOW_MIN_FILE_PROCESS_INTERVAL:-60}
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: ${AIRFLOW_DAG_DIR_LIST_INTERVAL:-300}

    # 기본 webserver worker 수(4)는 이 규모에서 과하다.
    AIRFLOW__WEBSERVER__WORKERS: ${AIRFLOW_WEBSERVER_WORKERS:-2}

    # webserver와 scheduler가 각각 과도한 DB connection pool을 잡지 않게 한다.
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: ${AIRFLOW_SQL_ALCHEMY_POOL_SIZE:-5}
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: ${AIRFLOW_SQL_ALCHEMY_MAX_OVERFLOW:-5}

    # travel_etl 패키지(src.domains.travel_etl) 임포트 경로
    PYTHONPATH: /opt/airflow/sodosiro

    # 여행지 ETL 설정 (docker/.env 에서 주입)
    TRAVEL_DB_URL: ${TRAVEL_DB_URL:-}
    PUBLIC_DATA_API_KEY: ${PUBLIC_DATA_API_KEY:-}
    PUBLIC_DATA_PAGE_SIZE: ${PUBLIC_DATA_PAGE_SIZE:-500}
    DETAIL_BATCH_LIMIT: ${DETAIL_BATCH_LIMIT:-300}
    IMAGE_RECOVERY_BATCH_LIMIT: ${IMAGE_RECOVERY_BATCH_LIMIT:-300}
    # 원천 areaBasedList2 CSV 스냅샷. 모든 Airflow 컨테이너에서 동일하게 접근해야 한다.
    TRAVEL_SNAPSHOT_DIR: ${TRAVEL_SNAPSHOT_DIR:-/data/travel/raw}
    # 인기 관광지 트렌드 수집 원천 스냅샷
    TREND_SNAPSHOT_DIR: ${TREND_SNAPSHOT_DIR:-/data/trend/raw}
    API_MIN_INTERVAL_SEC: ${API_MIN_INTERVAL_SEC:-1.0}
    TRAVEL_LDONG_REGN_CODE: ${TRAVEL_LDONG_REGN_CODE:-51}
    # 비우면 관광·문화·음식·쇼핑·레포츠 등 전체 콘텐츠 유형
    TRAVEL_CONTENT_TYPE_ID: ${TRAVEL_CONTENT_TYPE_ID:-}
    # 적재 완료 후 변경분 통지 대상 Spring 서버 (AI 처리는 Spring 책임)
    SPRING_BASE_URL: ${SPRING_BASE_URL:-http://host.docker.internal:8081}
    SPRING_INTERNAL_ETL_TOKEN: ${SPRING_INTERNAL_ETL_TOKEN:-}
    # 테스트 안전장치: 한 DAG 실행에서 Spring AI에 통지할 최대 건수
    SPRING_NOTIFY_LIMIT: ${SPRING_NOTIFY_LIMIT:-10}

    # 인기 검색어 sync (BE Redis Sorted Set → search_keyword_trend 스냅샷)
    # REDIS_URL 을 주면 우선하고, 없으면 아래 조각으로 조립한다. host 는 공용 네트워크의 redis 서비스명.
    REDIS_URL: ${REDIS_URL:-}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    REDIS_DATABASE: ${REDIS_DATABASE:-0}
    # BE SearchTrendingService.WINDOW_DAYS 와 반드시 일치시킬 것
    SEARCH_TREND_WINDOW_DAYS: ${SEARCH_TREND_WINDOW_DAYS:-30}

  volumes:
    - ../src/domains/airflow/dags:/opt/airflow/dags
    - ../src/domains/airflow/plugins:/opt/airflow/plugins
    - ../src:/opt/airflow/sodosiro/src
    # travel_etl 설정(settings.py)이 읽는 프로젝트 루트 .env
    - ../.env:/opt/airflow/sodosiro/.env:ro
    - ../data:/data
    - airflow-logs:/opt/airflow/logs

  user: "${AIRFLOW_UID:-50000}:0"

services:
  # 최초 실행 시 DB 마이그레이션 및 관리자 계정 생성
  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

    environment:
      <<: *airflow-common-env

    restart: on-failure

    mem_limit: ${AIRFLOW_INIT_MEMORY_LIMIT:-768m}

  airflow-webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    mem_limit: ${AIRFLOW_WEBSERVER_MEMORY_LIMIT:-640m}

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8974/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    # LocalExecutor task subprocess도 scheduler 컨테이너에서 실행된다. ETL 실행
    # 중 필요한 여유를 포함하되 호스트 전체 메모리를 잠식하지 않도록 상한을 둔다.
    mem_limit: ${AIRFLOW_SCHEDULER_MEMORY_LIMIT:-1536m}

    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-logs:

# Backend Compose가 만든 공용 네트워크. 여기서 postgres/redis 서비스명을 해석한다.
networks:
  default:
    name: docker_default
    external: true
