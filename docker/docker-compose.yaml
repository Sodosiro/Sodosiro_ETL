x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # 외부에 분리한 PostgreSQL 주소로 변경
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URL}

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    # scheduler 컨테이너의 /health(8974) 엔드포인트를 활성화한다.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}

    # travel_etl 패키지(src.domains.travel_etl) 임포트 경로
    PYTHONPATH: /opt/airflow/sodosiro

    # 여행지 ETL 설정 (docker/.env 에서 주입)
    TRAVEL_DB_URL: ${TRAVEL_DB_URL:-}
    PUBLIC_DATA_API_KEY: ${PUBLIC_DATA_API_KEY:-}
    PUBLIC_DATA_PAGE_SIZE: ${PUBLIC_DATA_PAGE_SIZE:-500}
    DETAIL_BATCH_LIMIT: ${DETAIL_BATCH_LIMIT:-300}
    IMAGE_RECOVERY_BATCH_LIMIT: ${IMAGE_RECOVERY_BATCH_LIMIT:-300}
    # 원천 areaBasedList2 CSV 스냅샷. 모든 Airflow 컨테이너에서 동일하게 접근해야 한다.
    TRAVEL_SNAPSHOT_DIR: ${TRAVEL_SNAPSHOT_DIR:-/data/travel/raw}
    API_MIN_INTERVAL_SEC: ${API_MIN_INTERVAL_SEC:-1.0}
    TRAVEL_LDONG_REGN_CODE: ${TRAVEL_LDONG_REGN_CODE:-51}
    # 비우면 관광·문화·음식·쇼핑·레포츠 등 전체 콘텐츠 유형
    TRAVEL_CONTENT_TYPE_ID: ${TRAVEL_CONTENT_TYPE_ID:-}
    # 적재 완료 후 변경분 통지 대상 Spring 서버 (AI 처리는 Spring 책임)
    SPRING_BASE_URL: ${SPRING_BASE_URL:-http://host.docker.internal:8081}
    SPRING_API_USERNAME: ${SPRING_API_USERNAME:-}
    SPRING_API_PASSWORD: ${SPRING_API_PASSWORD:-}
    # 테스트 안전장치: 한 DAG 실행에서 Spring AI에 통지할 최대 건수
    SPRING_NOTIFY_LIMIT: ${SPRING_NOTIFY_LIMIT:-10}

  volumes:
    - ../src/domains/airflow/dags:/opt/airflow/dags
    - ../src/domains/airflow/plugins:/opt/airflow/plugins
    - ../src:/opt/airflow/sodosiro/src
    # travel_etl 설정(settings.py)이 읽는 프로젝트 루트 .env
    - ../.env:/opt/airflow/sodosiro/.env:ro
    - ../data:/data
    - airflow-logs:/opt/airflow/logs

  user: "${AIRFLOW_UID:-50000}:0"

services:
  # 최초 실행 시 DB 마이그레이션 및 관리자 계정 생성
  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

    environment:
      <<: *airflow-common-env

    restart: on-failure

  airflow-webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8974/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-logs:
